name: Noise & Vibration Technologies
description: >-
  Noise & Vibration Technologies (NVT Group) is a Battery Ventures-backed platform of
  test-and-measurement companies that design, manufacture, and support equipment for
  measuring, simulating, and analyzing vibration, noise, shock, and other environmental
  variables. Its operating brands include Data Physics (SignalCalc dynamic signal
  analyzers and vibration controllers), Team Corporation (electrodynamic and hydraulic
  shakers), and Lansmont (package and product-testing systems), serving aerospace,
  defense, commercial space, automotive, and industrial customers worldwide. The company
  ships hardware and desktop analysis/control software rather than any public web API,
  REST service, SDK, or developer portal, so it has no programmable API surface for the
  API Evangelist network at this time.
